---
- name: Create kubeadm configuration directory
  ansible.builtin.file:
    path: /etc/kubernetes
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Copy kubeadm initialization configuration
  ansible.builtin.template:
    src: kubeadm-init.yaml.j2
    dest: /etc/kubernetes/kubeadm-init.yaml
    owner: root
    group: root
    mode: '0600'

- name: Validate kubeadm configuration
  ansible.builtin.command:
    cmd: kubeadm config validate --config /etc/kubernetes/kubeadm-init.yaml
  changed_when: false
